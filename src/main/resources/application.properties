spring.application.name=gps-tracker

spring.datasource.url = jdbc:postgresql://localhost:5432/gps
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Coordonnées de sécurité (Geofencing)
# Format : ${NOM_VAR_ENV:valeur_par_defaut}
app.geofencing.parking-latitude=${PARKING_LATITUDE:48.856612}
app.geofencing.parking-longitude=${PARKING_LONGITUDE:2.352221}
app.geofencing.max-radius-meters=${PARKING_MAX_RADIUS:50.0}
app.geofencing.alert-cooldown-minutes=${ALERT_COOLDOWN_MINUTES:5}

app.retention.days=${RETENTION_DAYS:30}

# Telegram bot
telegram.bot.token=${TELEGRAM_TOKEN_BOT:dummy-token}
telegram.chat.id=${TELEGRAM_CHAT_ID:000000000}
